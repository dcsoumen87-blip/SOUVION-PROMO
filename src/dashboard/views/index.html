<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Souvion Promo</title><style>body{font-family:system-ui;margin:2rem;max-width:1000px}pre{background:#111;color:#eee;padding:1rem;border-radius:8px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}.card{padding:1rem;border:1px solid #ddd;border-radius:8px}</style></head><body><h1>Souvion Promo</h1><p>Educational campaign simulator. No promotional DMs are sent.</p><div id="cards" class="grid"></div><h2>Campaigns</h2><pre id="campaigns">Loading…</pre><script>async function load(){const [a,c]=await Promise.all([fetch('/analytics').then(r=>r.json()),fetch('/campaigns').then(r=>r.json())]);document.querySelector('#cards').innerHTML=Object.entries(a).map(([k,v])=>`<div class="card"><b>${k}</b><div>${v}</div></div>`).join('');document.querySelector('#campaigns').textContent=JSON.stringify(c,null,2)}load().catch(e=>document.body.innerHTML+='<p>'+e+'</p>');</script></body></html>
